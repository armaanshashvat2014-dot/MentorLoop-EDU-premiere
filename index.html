
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MentorLoop EDU</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:
radial-gradient(circle at top left,#0891b2 0%,transparent 30%),
radial-gradient(circle at bottom right,#8b5cf6 0%,transparent 30%),
#020617;
min-height:100vh;
color:white;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
background-size:40px 40px;
z-index:-2;
}

.navbar{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:rgba(15,23,42,0.72);
backdrop-filter:blur(20px);
border-bottom:1px solid rgba(255,255,255,0.06);
z-index:999;
}

.logo{
font-size:28px;
font-weight:900;
}

.logo span{
background:linear-gradient(90deg,#22d3ee,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.nav-links{
display:flex;
gap:32px;
}

.nav-links a{
text-decoration:none;
color:#cbd5e1;
font-weight:600;
transition:0.3s;
}

.nav-links a:hover{
color:white;
}

.hero{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:120px 20px 40px;
}

.hero-card{
width:100%;
max-width:800px;
background:rgba(15,23,42,0.72);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
border-radius:32px;
padding:50px;
text-align:center;
}

.hero h1{
font-size:72px;
font-weight:900;
line-height:1;
}

.hero h1 span{
background:linear-gradient(90deg,#22d3ee,#8b5cf6);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero p{
margin-top:22px;
font-size:20px;
line-height:1.7;
color:#94a3b8;
}

.login-btn{
width:100%;
padding:18px;
border:none;
border-radius:20px;
background:linear-gradient(90deg,#22d3ee,#8b5cf6);
color:white;
font-size:18px;
font-weight:700;
cursor:pointer;
margin-top:34px;
transition:0.3s;
}

.login-btn:hover{
transform:translateY(-4px);
}

.toast{
position:fixed;
bottom:30px;
right:30px;
padding:18px 24px;
background:rgba(15,23,42,0.92);
border:1px solid rgba(255,255,255,0.08);
border-radius:20px;
backdrop-filter:blur(20px);
z-index:99999;
}

@media(max-width:768px){

.hero h1{
font-size:52px;
}

.nav-links{
gap:18px;
font-size:14px;
}

.navbar{
padding:18px 20px;
}

}

</style>
</head>
<body>

<nav class="navbar">

<div class="logo">
MentorLoop <span>EDU</span>
</div>


</nav>

<section class="hero">

<div class="hero-card">

<h1>
Learn.<br>
Build.<br>
<span>Dominate.</span>
</h1>

<p>
MentorLoop EDU helps students learn smarter,
compete globally, and grow with AI.
</p>

<button
id="googleBtn"
class="login-btn"
>
Continue with Google
</button>

</div>

</section>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
setDoc
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
signInWithRedirect,
getRedirectResult,
browserLocalPersistence,
setPersistence
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyAltyInwHSCxX3Mi9LjjPUs1767uo70gDQ",
  authDomain: "mentorloop-premiere.firebaseapp.com",
  projectId: "mentorloop-premiere",
  storageBucket: "mentorloop-premiere.firebasestorage.app",
  messagingSenderId: "55345483492",
  appId: "1:55345483492:web:47407fdbd92a2278aea6f1",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

await setPersistence(
auth,
browserLocalPersistence
);

const provider = new GoogleAuthProvider();

function showToast(message){

const toast = document.createElement("div");

toast.className = "toast";

toast.innerHTML = message;

document.body.appendChild(toast);

setTimeout(()=>{
toast.remove();
},3000);

}

async function createUser(user){

const mapRef =
doc(db,"user_map",user.uid);

const mapSnap =
await getDoc(mapRef);

let publicId;

if(mapSnap.exists()){

publicId =
mapSnap.data().publicId;

}

else{

publicId =
"user_" +
Math.random()
.toString(36)
.substring(2,8);

await setDoc(
mapRef,
{
publicId:publicId
}
);

}

await setDoc(

doc(db,"users",publicId),

{
name:user.displayName || "User",
email:user.email || "",
photo:user.photoURL || "",
publicId:publicId,
uid:user.uid,
createdAt:Date.now()

},

{merge:true}

);

await setDoc(

doc(db,"leaderboard",publicId),

{
name:user.displayName || "User",
points:0,
streak:0,
publicId:publicId

},

{merge:true}

);

location.href =
"home.html";

}

async function login(){

try{

const isMobile =
/Android|iPhone|iPad|iPod/i
.test(navigator.userAgent);

if(isMobile){

await signInWithRedirect(
auth,
provider
);

return;

}

const result =
await signInWithPopup(
auth,
provider
);

if(!result.user) return;

await createUser(result.user);

}

catch(err){

console.error(err);
showToast(err.message);

}

}

document
.getElementById("googleBtn")
.addEventListener(
"click",
login
);

getRedirectResult(auth)
.then(async(result)=>{

if(result && result.user){
await createUser(result.user);
}

})
.catch(console.error);

</script>

</body>
</html>
