<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MentorLoop Premiere</title>
<style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  background: #0f172a;
  color: white;
}
header {
  padding: 20px;
  text-align: center;
  font-size: 24px;
  background: #020617;
}
.container {
  display: flex;
}
.sidebar {
  width: 220px;
  background: #020617;
  padding: 20px;
}
.sidebar button {
  width: 100%;
  margin: 10px 0;
  padding: 10px;
  border: none;
  background: #1e293b;
  color: white;
  cursor: pointer;
}
.main {
  flex: 1;
  padding: 20px;
}
.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 10px;
}
input, textarea {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  background: #020617;
  color: white;
  border: 1px solid #334155;
}
button.action {
  margin-top: 10px;
  padding: 10px;
  background: #38bdf8;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<header>🚀 MentorLoop Premiere</header>

<div class="container">
  <div class="sidebar">
    <button onclick="show('mentor')">AI Mentor</button>
    <button onclick="show('build')">Build Mode</button>
    <button onclick="show('solver')">Problem Solver</button>
    <button onclick="show('dashboard')">Dashboard</button>
  </div>

  <div class="main">

    <!-- AI Mentor -->
    <div id="mentor" class="card">
      <h2>🧠 AI Mentor</h2>
      <input id="question" placeholder="Ask anything...">
      <button class="action" onclick="askAI()">Ask</button>
      <p id="answer"></p>
    </div>

    <!-- Build Mode -->
    <div id="build" class="card" style="display:none">
      <h2>🛠 Build Mode</h2>
      <input id="idea" placeholder="What do you want to build?">
      <button class="action" onclick="buildPlan()">Generate Plan</button>
      <div id="plan"></div>

      <textarea id="code" placeholder="Paste code (optional)"></textarea>
      <button class="action" onclick="analyzeCode()">Analyze</button>
      <p id="analysis"></p>
    </div>

    <!-- Problem Solver -->
    <div id="solver" class="card" style="display:none">
      <h2>⚡ Problem Solver</h2>
      <textarea id="problem" placeholder="Paste error or doubt"></textarea>
      <button class="action" onclick="solve()">Solve</button>
      <div id="solution"></div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="card" style="display:none">
      <h2>📊 Growth Dashboard</h2>
      <p>XP: <span id="xp">0</span></p>
      <p>Streak 🔥: <span id="streak">1</span></p>
      <progress id="progress" value="0" max="100"></progress>
    </div>

  </div>
</div>

<script>
let xp = localStorage.getItem("xp") || 0;
let streak = localStorage.getItem("streak") || 1;
let last = localStorage.getItem("last") || new Date().toDateString();

document.getElementById("xp").innerText = xp;
document.getElementById("streak").innerText = streak;

function addXP(val){
  xp = parseInt(xp) + val;
  localStorage.setItem("xp", xp);
  document.getElementById("xp").innerText = xp;
  document.getElementById("progress").value = xp % 100;
}

function show(id){
  ["mentor","build","solver","dashboard"].forEach(x=>{
    document.getElementById(x).style.display="none";
  });
  document.getElementById(id).style.display="block";
}

// AI Mentor
function askAI(){
  let q = document.getElementById("question").value.toLowerCase();
  let res = "";

  if(q.includes("gravity")){
    res = "Gravity pulls objects toward each other. On Earth, it keeps us grounded.";
  } else if(q.includes("python")){
    res = "Python is a powerful programming language used for AI, apps, and automation.";
  } else if(q.includes("html")){
    res = "HTML structures web pages using elements like headings, paragraphs, and links.";
  } else {
    res = "Break it into smaller parts. Understand the core idea first, then apply step-by-step.";
  }

  document.getElementById("answer").innerText = res;
  addXP(10);
}

// Build Mode
function buildPlan(){
  let idea = document.getElementById("idea").value;
  document.getElementById("plan").innerHTML = `
  <ol>
    <li>Define goal → ${idea}</li>
    <li>Break into features</li>
    <li>Design UI</li>
    <li>Code basic version</li>
    <li>Test & fix errors</li>
    <li>Improve & launch 🚀</li>
  </ol>`;
  addXP(15);
}

function analyzeCode(){
  let code = document.getElementById("code").value;

  if(code.includes("error") || code.length < 10){
    document.getElementById("analysis").innerText = "Check syntax or missing logic.";
  } else {
    document.getElementById("analysis").innerText = "Code looks structurally okay.";
  }
}

// Solver
function solve(){
  let p = document.getElementById("problem").value;

  document.getElementById("solution").innerHTML = `
  <h4>Explanation</h4>
  <p>This issue may be due to incorrect syntax or logic.</p>
  <h4>Solution</h4>
  <p>Check indentation, variables, and imports.</p>
  <h4>Why it works</h4>
  <p>Fixing structure ensures correct execution.</p>
  `;
  addXP(20);
}

// Streak system
let today = new Date().toDateString();
if(last !== today){
  streak++;
  localStorage.setItem("streak", streak);
  localStorage.setItem("last", today);
}
</script>

</body>
</html>
