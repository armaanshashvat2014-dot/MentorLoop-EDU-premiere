<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MentorLoop Core</title>

<style>
body {
  margin:0;
  font-family:Segoe UI;
  background:#0f172a;
  color:white;
}
header {
  text-align:center;
  padding:15px;
  font-size:22px;
  background:#020617;
}
.main {
  max-width:800px;
  margin:auto;
  padding:20px;
}
.card {
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}
textarea, input {
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#020617;
  color:white;
  border:1px solid #334155;
}
button {
  margin-top:10px;
  padding:10px;
  background:#38bdf8;
  border:none;
  cursor:pointer;
}
pre {
  background:#020617;
  padding:10px;
  overflow:auto;
}
.small {
  font-size:13px;
  opacity:0.7;
}
</style>
</head>

<body>

<header>🚀 MentorLoop — Fix • Build • Learn</header>

<div class="main">

<div class="card">
<h2>⚡ Fix / Build Anything</h2>
<textarea id="input" placeholder="Paste error OR describe what you want to build..."></textarea>
<button onclick="process()">Solve</button>
</div>

<div class="card">
<h3>🧠 Result</h3>
<pre id="output"></pre>
</div>

<div class="card">
<h3>📊 Progress</h3>
<p>XP: <span id="xp">0</span></p>
<p>Level: <span id="lvl">1</span></p>
</div>

<div class="card">
<h3>📜 History</h3>
<div id="history" class="small"></div>
</div>

</div>

<script>
// ---------------- STATE ----------------
let xp = parseInt(localStorage.getItem("xp") || 0);
let history = JSON.parse(localStorage.getItem("history") || "[]");

updateUI();

// ---------------- PROCESS ----------------
function process(){
  let input = document.getElementById("input").value.toLowerCase();
  let result = "";

  // ---- CODE FIX DETECTION ----
  if(input.includes("error") || input.includes("undefined") || input.includes("not defined")){
    result = `🔧 FIX:

Problem: Variable or logic issue detected.

Solution:
- Check variable declarations
- Ensure correct spelling
- Verify scope

Example Fix:
let x = 10;
console.log(x);

Why:
Undefined errors happen when variables aren't declared properly.`;
  }

  // ---- BUILD WEBSITE ----
  else if(input.includes("website") || input.includes("page")){
    result = `🛠 BUILD:

Here’s a starter website:

<html>
<head>
<title>My Site</title>
<style>
body { font-family:Arial; text-align:center; }
</style>
</head>
<body>

<h1>Hello World</h1>
<p>Your site is live 🚀</p>

</body>
</html>

Why:
This gives structure + styling + content in one go.`;
  }

  // ---- LOGIN SYSTEM ----
  else if(input.includes("login")){
    result = `🛠 BUILD LOGIN:

<input placeholder="Username">
<input type="password" placeholder="Password">
<button onclick="login()">Login</button>

<script>
function login(){
 alert("Logged in (demo)");
}
</script>
<script>

Why:
Basic input + function = working prototype.`;
  }

  // ---- GENERAL ----
  else{
    result = `🧠 THINK:

1. Break problem into steps
2. Solve one step at a time
3. Test output

Tip:
Clear thinking > complex code`;
  }

  // OUTPUT
  document.getElementById("output").innerText = result;

  // XP
  xp += 10;
  localStorage.setItem("xp", xp);

  // HISTORY
  history.unshift(input);
  history = history.slice(0,5);
  localStorage.setItem("history", JSON.stringify(history));

  updateUI();
}

// ---------------- UI ----------------
function updateUI(){
  document.getElementById("xp").innerText = xp;
  document.getElementById("lvl").innerText = Math.floor(xp/100)+1;

  document.getElementById("history").innerHTML =
    history.map(h => "• " + h).join("<br>");
}
</script>

</body>
</html>
