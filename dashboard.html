<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>MentorLoop Dashboard</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet"
>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Inter',sans-serif;

background:
radial-gradient(circle at top left,#0891b2 0%,transparent 30%),
radial-gradient(circle at bottom right,#8b5cf6 0%,transparent 30%),
#020617;

color:white;

min-height:100vh;

overflow-x:hidden;

}

/* GRID */

body::before{

content:'';

position:fixed;

inset:0;

background-image:
linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

background-size:40px 40px;

z-index:-2;

}

/* NAVBAR */

.navbar{

position:fixed;

top:0;
left:0;

width:100%;

display:flex;

justify-content:space-between;

align-items:center;

padding:20px 40px;

background:
rgba(15,23,42,0.72);

backdrop-filter:blur(20px);

border-bottom:
1px solid rgba(255,255,255,0.06);

z-index:999;

}

.logo{

font-size:28px;

font-weight:900;

}

.logo span{

background:
linear-gradient(
90deg,
#22d3ee,
#8b5cf6
);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

.nav-links{

display:flex;

gap:32px;

}

.nav-links a{

text-decoration:none;

color:#cbd5e1;

font-weight:600;

transition:0.3s;

}

.nav-links a:hover{
color:white;
}

/* PROFILE */

.profile{

display:flex;

align-items:center;

gap:14px;

}

.user-photo{

width:48px;
height:48px;

border-radius:50%;

object-fit:cover;

border:
2px solid rgba(255,255,255,0.1);

}

/* MAIN */

.main{

padding:
130px 30px 40px;

max-width:1500px;

margin:auto;

}

/* HERO */

.hero{

background:
rgba(15,23,42,0.72);

border:
1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(20px);

border-radius:34px;

padding:40px;

position:relative;

overflow:hidden;

}

.hero::before{

content:'';

position:absolute;

width:260px;
height:260px;

border-radius:50%;

background:
rgba(255,255,255,0.03);

top:-120px;
right:-120px;

}

.hero h1{

font-size:58px;

font-weight:900;

line-height:1;

}

.hero p{

margin-top:16px;

font-size:18px;

color:#94a3b8;

line-height:1.7;

}

/* USER ID */

#myPublicId{

margin-top:20px;

display:inline-block;

padding:12px 18px;

border-radius:18px;

background:
rgba(34,211,238,0.08);

border:
1px solid rgba(34,211,238,0.14);

color:#7dd3fc;

font-weight:700;

font-size:15px;

letter-spacing:0.4px;

}

/* STATS */

.stats{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:18px;

margin-top:30px;

}

.stat{

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.08);

border-radius:24px;

padding:26px;

transition:0.3s;

}

.stat:hover{

transform:
translateY(-6px);

box-shadow:
0 20px 60px rgba(34,211,238,0.12);

}

.stat h2{

font-size:46px;

font-weight:900;

}

.stat span{

color:#94a3b8;

}

/* GRID */

.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(340px,1fr));

gap:22px;

margin-top:26px;

}

/* CARD */

.card{

background:
rgba(15,23,42,0.72);

border:
1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:28px;

}

.card h2{

margin-bottom:20px;

font-size:28px;

}

/* NAVIGATION */

.nav-grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:16px;

}

.nav-btn{

text-decoration:none;

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.08);

border-radius:22px;

padding:24px;

color:white;

transition:0.3s;

}

.nav-btn:hover{

transform:
translateY(-6px);

background:
rgba(34,211,238,0.1);

}

.nav-btn h3{

margin-top:14px;

font-size:22px;

}

/* FRIENDS */

.add-friend-box{

display:flex;

gap:12px;

margin-bottom:20px;

}

.add-friend-box input{

flex:1;

padding:14px;

border:none;

outline:none;

border-radius:16px;

background:
rgba(255,255,255,0.06);

color:white;

}

.add-friend-box button{

padding:14px 18px;

border:none;

border-radius:16px;

background:
linear-gradient(
90deg,
#22d3ee,
#8b5cf6
);

color:white;

font-weight:700;

cursor:pointer;

}

.friend{

display:flex;

justify-content:space-between;

align-items:center;

padding:16px;

border-radius:20px;

background:
rgba(255,255,255,0.04);

margin-top:14px;

border:
1px solid rgba(255,255,255,0.05);

}

.friend-left{

display:flex;

flex-direction:column;

gap:4px;

}

.friend-name{

font-weight:700;

font-size:16px;

}

.friend-id{

font-size:13px;

color:#94a3b8;

}

.online{

color:#10b981;

font-size:14px;

font-weight:700;

}

/* MOTIVATION */

.quote{

font-size:22px;

line-height:1.7;

color:#e2e8f0;

}

.fact{

margin-top:20px;

padding:18px;

border-radius:18px;

background:
rgba(34,211,238,0.08);

border:
1px solid rgba(34,211,238,0.12);

line-height:1.7;

color:#cbd5e1;

}

/* MOBILE */

@media(max-width:768px){

.navbar{

padding:18px 20px;

}

.nav-links{

gap:18px;

font-size:14px;

}

.main{

padding:
120px 18px 18px;

}

.hero h1{

font-size:42px;

}

.nav-grid{

grid-template-columns:1fr;

}

}

</style>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">

<div class="logo">
MentorLoop <span>EDU</span>
</div>

<div class="nav-links">

<a href="index.html">
Home
</a>

<a href="features.html">
Features
</a>

<a href="leaderboard.html">
Leaderboard
</a>

<a href="chat.html">
Community
</a>

</div>

<div class="profile">

<img
id="userPhoto"
class="user-photo"
src="https://ui-avatars.com/api/?name=User"
>

</div>

</nav>

<!-- MAIN -->

<div class="main">

<!-- HERO -->

<div class="hero">

<h1 id="welcomeName">
Welcome back 👋
</h1>

<p id="myPublicId">
Loading ID...
</p>

<p>
Stay consistent. Small progress every day becomes huge results.
</p>

<div class="stats">

<div class="stat">

<h2 id="points">
0
</h2>

<span>
Total Points
</span>

</div>

<div class="stat">

<h2 id="streak">
0
</h2>

<span>
Day Streak
</span>

</div>

<div class="stat">

<h2 id="friendCount">
0
</h2>

<span>
Friends
</span>

</div>

</div>

</div>

<!-- GRID -->

<div class="grid">

<!-- NAVIGATION -->

<div class="card">

<h2>
⚡ Navigation
</h2>

<div class="nav-grid">

<a
href="games.html"
class="nav-btn"
>

🎮

<h3>
Quizzes
</h3>

</a>

<a
href="profile.html"
class="nav-btn"
>

👤

<h3>
Profile
</h3>

</a>

<a
href="teacher.html"
class="nav-btn"
>

🎓

<h3>
Teacher Zone
</h3>

</a>

<a
href="https://learning-ai-2.streamlit.app/"
class="nav-btn"
>

🤖

<h3>
AI Doubt Solver
</h3>

</a>

</div>

</div>

<!-- FRIENDS -->

<div class="card">

<h2>
👥 Friends
</h2>

<div class="add-friend-box">

<input
id="friendInput"
type="text"
placeholder="Enter friend's ID and press Enter"
onkeydown="handleFriendEnter(event)"
>

<button onclick="addFriend()">
+ Add Friend
</button>

</div>

<div id="friendsList"></div>

</div>

<!-- MOTIVATION -->

<div class="card">

<h2>
🚀 Motivation
</h2>

<div
class="quote"
id="quote"
>
</div>

<div
class="fact"
id="fact"
>
</div>

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {

getFirestore,
doc,
getDoc,
setDoc,
collection,
getDocs

}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {

getAuth,
onAuthStateChanged,
browserLocalPersistence,
setPersistence

}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

/* FIREBASE */

const firebaseConfig = {

apiKey:"YOUR_API_KEY",

authDomain:"YOUR_AUTH_DOMAIN",

projectId:"YOUR_PROJECT_ID",

storageBucket:"YOUR_STORAGE_BUCKET",

messagingSenderId:"YOUR_SENDER_ID",

appId:"YOUR_APP_ID"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

await setPersistence(
auth,
browserLocalPersistence
);

/* QUOTES */

const quotes = [

"Consistency beats intensity.",

"Every expert started as a beginner.",

"Learning compounds daily.",

"Small progress still matters."

];

const facts = [

"Sleep improves memory retention.",

"Teaching others improves learning.",

"Short study sessions improve focus.",

"Practice strengthens neural pathways."

];

document
.getElementById("quote")
.innerText =

quotes[
Math.floor(
Math.random()*quotes.length
)
];

document
.getElementById("fact")
.innerText =

facts[
Math.floor(
Math.random()*facts.length
)
];

/* GLOBAL */

let currentPublicId = null;

/* AUTH */

onAuthStateChanged(
auth,
async(user)=>{

if(!user) return;

/* PHOTO */

const photo =

user.photoURL ||

"https://ui-avatars.com/api/?name=" +

encodeURIComponent(
user.displayName || "User"
);

document
.getElementById("userPhoto")
.src = photo;

/* WELCOME */

document
.getElementById("welcomeName")
.innerHTML =

`Welcome back,
${user.displayName} 👋`;

/* PUBLIC ID */

const mapSnap =

await getDoc(
doc(
db,
"user_map",
user.uid
)
);

if(!mapSnap.exists()) return;

currentPublicId =

mapSnap.data().publicId;

/* SHOW ID */

document
.getElementById("myPublicId")
.innerHTML =

"🆔 Your Friend ID: <b>" +

currentPublicId +

"</b>";

/* LEADERBOARD */

const lbSnap =

await getDoc(
doc(
db,
"leaderboard",
currentPublicId
)
);

if(lbSnap.exists()){

const data =
lbSnap.data();

document
.getElementById("points")
.innerText =

data.points || 0;

document
.getElementById("streak")
.innerText =

data.streak || 0;

}

/* FRIENDS */

loadFriends();

}
);

/* LOAD FRIENDS */

async function loadFriends(){

const friendsList =

document.getElementById(
"friendsList"
);

friendsList.innerHTML = "";

const friendsSnap =

await getDocs(

collection(
db,
"users",
currentPublicId,
"friends"
)

);

document
.getElementById("friendCount")
.innerText =

friendsSnap.size;

if(friendsSnap.empty){

friendsList.innerHTML =

`
<p style="
color:#94a3b8;
">
No friends yet.
</p>
`;

return;

}

friendsSnap.forEach(docu=>{

const data =
docu.data();

const div =
document.createElement("div");

div.className =
"friend";

div.innerHTML = `

<div class="friend-left">

<div class="friend-name">
${data.name}
</div>

<div class="friend-id">
ID: ${data.publicId}
</div>

</div>

<span class="online">
● Friend
</span>

`;

friendsList.appendChild(div);

});

}

/* ADD FRIEND */

window.addFriend =
async function(){

const friendId =

document
.getElementById("friendInput")
.value
.trim();

if(!friendId){

alert(
"Enter a public ID"
);

return;

}

if(friendId === currentPublicId){

alert(
"You cannot add yourself"
);

return;

}

try{

const friendSnap =

await getDoc(

doc(
db,
"users",
friendId
)

);

if(!friendSnap.exists()){

alert(
"User not found"
);

return;

}

const friendData =
friendSnap.data();

const mySnap =

await getDoc(

doc(
db,
"users",
currentPublicId
)

);

const myData =
mySnap.data();

/* SAVE FOR ME */

await setDoc(

doc(
db,
"users",
currentPublicId,
"friends",
friendId
),

{

name:
friendData.name,

publicId:
friendId,

photo:
friendData.photo || ""

}

);

/* SAVE FOR FRIEND */

await setDoc(

doc(
db,
"users",
friendId,
"friends",
currentPublicId
),

{

name:
myData.name,

publicId:
currentPublicId,

photo:
myData.photo || ""

}

);

document
.getElementById("friendInput")
.value = "";

loadFriends();

alert(
"Friend added successfully!"
);

}

catch(err){

console.error(err);

alert(
"Failed to add friend"
);

}

}

/* ENTER KEY */

window.handleFriendEnter =
function(event){

if(event.key === "Enter"){

event.preventDefault();

addFriend();

}

}

</script>

</body>
</html>
