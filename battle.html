<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>MentorLoop Battle Arena</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Inter',sans-serif;

background:
radial-gradient(circle at top left,#0ea5e9 0%,transparent 25%),
radial-gradient(circle at bottom right,#8b5cf6 0%,transparent 25%),
#020617;

color:white;

overflow-x:hidden;

min-height:100vh;

}

/* GRID */

body::before{

content:'';

position:fixed;

inset:0;

background-image:
linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);

background-size:40px 40px;

z-index:-2;

}

/* NAVBAR */

.navbar{

position:fixed;

top:0;
left:0;

width:100%;

display:flex;

justify-content:space-between;

align-items:center;

padding:20px 40px;

background:
rgba(15,23,42,0.72);

backdrop-filter:blur(18px);

border-bottom:
1px solid rgba(255,255,255,0.06);

z-index:999;

}

.logo{

font-size:30px;

font-weight:900;

}

.logo span{

background:
linear-gradient(
90deg,
#22d3ee,
#8b5cf6
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.nav-links{

display:flex;

gap:28px;

}

.nav-links a{

text-decoration:none;

color:#cbd5e1;

font-weight:700;

}

/* MAIN */

.main{

padding:
120px 20px 40px;

max-width:1600px;

margin:auto;

}

/* HERO */

.hero{

background:
rgba(15,23,42,0.72);

border:
1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(20px);

border-radius:36px;

padding:40px;

}

.hero h1{

font-size:70px;

font-weight:900;

line-height:1;

}

.hero h1 span{

background:
linear-gradient(
90deg,
#22d3ee,
#8b5cf6
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.hero p{

margin-top:18px;

color:#94a3b8;

font-size:18px;

line-height:1.8;

}

/* SETTINGS */

.settings{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:16px;

margin-top:24px;

}

select{

padding:16px;

border:none;

outline:none;

border-radius:18px;

background:
rgba(255,255,255,0.06);

color:white;

font-size:15px;

}

option{
background:#111827;
}

.btn{

padding:16px;

border:none;

border-radius:18px;

background:
linear-gradient(
90deg,
#22d3ee,
#8b5cf6
);

color:white;

font-weight:800;

cursor:pointer;

transition:0.3s;

}

.btn:hover{

transform:
translateY(-4px);

}

/* TRACK */

.track-container{

margin-top:26px;

background:
rgba(15,23,42,0.72);

border:
1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(20px);

border-radius:36px;

padding:30px;

overflow:hidden;

}

.track{

perspective:1200px;

margin-top:24px;

}

.lane{

position:relative;

height:120px;

margin-bottom:26px;

border-radius:26px;

overflow:hidden;

background:
linear-gradient(
180deg,
#1f2937,
#111827
);

transform:
perspective(1000px)
rotateX(60deg);

box-shadow:
inset 0 20px 40px rgba(255,255,255,0.05),
0 40px 80px rgba(0,0,0,0.45);

}

.lane::before{

content:'';

position:absolute;

inset:0;

background:
repeating-linear-gradient(
90deg,
transparent 0px,
transparent 40px,
rgba(255,255,255,0.08) 40px,
rgba(255,255,255,0.08) 70px
);

animation:roadMove 1s linear infinite;

}

@keyframes roadMove{

from{
transform:translateX(0px);
}

to{
transform:translateX(-110px);
}

}

.player-label{

position:absolute;

left:20px;
top:10px;

font-weight:800;

font-size:14px;

color:#cbd5e1;

z-index:20;

}

.car{

position:absolute;

left:10px;
top:34px;

font-size:52px;

transition:
1s cubic-bezier(.22,1,.36,1);

z-index:30;

filter:
drop-shadow(0 0 18px rgba(255,255,255,0.4));

}

.boost{

animation:boost 0.5s infinite alternate;

}

@keyframes boost{

from{
transform:scale(1);
}

to{
transform:scale(1.08);
}

}

/* HUD */

.hud{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:16px;

margin-top:24px;

}

.hud-box{

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.08);

padding:20px;

border-radius:24px;

text-align:center;

}

.hud-box h3{

font-size:14px;

color:#94a3b8;

margin-bottom:10px;

}

.hud-box div{

font-size:34px;

font-weight:900;

}

/* QUIZ */

.quiz{

margin-top:26px;

background:
rgba(15,23,42,0.72);

border:
1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(20px);

border-radius:36px;

padding:30px;

}

.question{

font-size:34px;

font-weight:900;

line-height:1.5;

margin-bottom:24px;

}

.options{

display:grid;

gap:14px;

}

.option-btn{

padding:18px;

border:none;

border-radius:18px;

background:
rgba(255,255,255,0.05);

color:white;

font-size:16px;

font-weight:700;

cursor:pointer;

transition:0.3s;

}

.option-btn:hover{

transform:
translateY(-4px);

background:
rgba(34,211,238,0.1);

}

/* MATH INPUT */

#mathInput{

width:100%;

padding:18px;

border:none;

outline:none;

border-radius:18px;

background:
rgba(255,255,255,0.06);

color:white;

font-size:18px;

display:none;

}

/* COUNTDOWN */

.countdown{

position:fixed;

inset:0;

display:none;

justify-content:center;

align-items:center;

font-size:180px;

font-weight:900;

background:
rgba(2,6,23,0.7);

backdrop-filter:blur(10px);

z-index:5000;

}

/* WINNER */

.winner{

position:fixed;

inset:0;

display:none;

justify-content:center;

align-items:center;

background:
rgba(2,6,23,0.82);

backdrop-filter:blur(10px);

z-index:6000;

}

.winner-card{

background:
rgba(15,23,42,0.95);

padding:50px;

border-radius:36px;

text-align:center;

max-width:500px;

width:90%;

border:
1px solid rgba(255,255,255,0.08);

}

.winner-card h1{

font-size:80px;

}

.winner-card h2{

margin-top:18px;

font-size:42px;

}

.winner-card p{

margin-top:16px;

color:#94a3b8;

line-height:1.8;

}

@media(max-width:900px){

.settings{
grid-template-columns:1fr;
}

.hud{
grid-template-columns:repeat(2,1fr);
}

.hero h1{
font-size:44px;
}

.question{
font-size:26px;
}

.countdown{
font-size:100px;
}

.navbar{
padding:18px 20px;
}

.nav-links{
gap:16px;
font-size:14px;
}

}

</style>
</head>

<body>

3
</div>

<div

<div class="winner-card">

🥇
</h1>

<h2 id="winnerText">
Winner

<p id="winnerDesc">
Race Finished
</p>

<button

</button>

</div>

</div>

<nav class="navbar">

<div class="logo">
MentorLoop <span>Battle</span>
</div>

<div class="nav-links">

<a href="dashboard.html">
Dashboard
</a>

<a href="games.html">
Games
</a>

<a href="leaderboard.html">
Leaderboard
</a>

<a href="chat.html">
Community
</a>

</div>

</nav>

<div class="main">

<div class="hero">

<h1>
3D <span>Battle Arena</span>
</h1>

<p>
Race up to 5 players in an Asphalt-style educational battle.
</p>

<div class="settings">

<select id="subject">

<option>Math</option>
<option>Science</option>
<option>Coding</option>
<option>History</option>

</select>

<select id="grade">

<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>

</select>

<select id="difficulty">

<option>Easy</option>
<option>Medium</option>
<option>Hard</option>

</select>

<button
class="btn"
onclick="startRace()"
>
Start Race
</button>

</div>

</div>

<div class="track-container">

<h2>
🏎️ 3D Racing Track
</h2>

<div class="hud">

<div class="hud-box">

<h3>
Question
</h3>

<div id="questionCount">
0/10
</div>

</div>

<div class="hud-box">

<h3>
Timer
</h3>

<div id="timer">
20
</div>

</div>

<div class="hud-box">

<h3>
Your Score
</h3>

<div id="myScore">
0
</div>

</div>

<div class="hud-box">

<h3>
Leader
</h3>

<div id="enemyScore">
0
</div>

</div>

</div>

<div
class="track"
id="track"
></div>

</div>

<div class="quiz">

<div
class="question"
id="question"
>
Press Start Race
</div>

<div
class="options"
id="options"
></div>

<input
id="mathInput"
placeholder="Type answer and press Enter"
/>

<script>

/* QUESTIONS */

const questionBank = {

Math:{

5:{

Easy:[

{
q:"12 + 8 = ?",
correct:"20"
},

{
q:"5 × 6 = ?",
correct:"30"
},

{
q:"50 ÷ 5 = ?",
correct:"10"
},

{
q:"9 × 9 = ?",
correct:"81"
},

{
q:"100 - 45 = ?",
correct:"55"
},

{
q:"7 × 8 = ?",
correct:"56"
},

{
q:"14 + 16 = ?",
correct:"30"
},

{
q:"72 ÷ 8 = ?",
correct:"9"
},

{
q:"15 × 4 = ?",
correct:"60"
},

{
q:"90 - 27 = ?",
correct:"63"
}

]

}

},

Science:{

5:{

Easy:[

{
q:"H₂O is?",
o:[
"Water",
"Salt",
"Oxygen",
"Hydrogen"
],
a:0
},

{
q:"Earth revolves around?",
o:[
"Moon",
"Sun",
"Mars",
"Jupiter"
],
a:1
}

]

}

},

Coding:{

5:{

Easy:[

{
q:"HTML stands for?",
o:[
"Hyper Text Markup Language",
"HighText Machine Language",
"Home Tool ML",
"Hyper Tool Main Language"
],
a:0
}

]

}

},

History:{

5:{

Easy:[

{
q:"Who discovered America?",
o:[
"Christopher Columbus",
"Einstein",
"Newton",
"Napoleon"
],
a:0
}

]

}

}

};

/* STATE */

let raceQuestions = [];

let currentQuestionIndex = 0;

let timer = 20;

let timerInterval = null;

let players = [];

const MAX_PLAYERS = 5;

const MIN_PLAYERS = 2;

/* SHUFFLE */

function shuffle(arr){

return arr.sort(
()=>Math.random()-0.5
);

}

/* START */

async function startRace(){

const playerCount =

parseInt(
prompt(
"How many racers? (2-5)"
)
);

if(

isNaN(playerCount) ||

playerCount < MIN_PLAYERS ||

playerCount > MAX_PLAYERS

){

alert(
"Race must have 2-5 players."
);

return;

}

players = [];

currentQuestionIndex = 0;

/* CREATE PLAYERS */

for(let i=0;i<playerCount;i++){

players.push({

name:
i===0
? "YOU"
: `RACER ${i}`,

score:0,

emoji:
i===0
? "🏎️"
: ["🚓","🚗","🏍️","🚙"][i-1]

});

}

/* BUILD TRACK */

buildTrack();

updateHUD();

await countdown();

generateRace();

renderQuestion();

}

/* BUILD TRACK */

function buildTrack(){

const track =
document.getElementById(
"track"
);

track.innerHTML = "";

players.forEach((player,index)=>{

const lane =
document.createElement("div");

lane.className =
"lane";

lane.innerHTML =

`

<div class="player-label">
${player.name}
</div>

<div
class="car"
id="car${index}"
>
${player.emoji}
</div>

`;

track.appendChild(lane);

});

}

/* COUNTDOWN */

async function countdown(){

const overlay =
document.getElementById(
"countdown"
);

overlay.style.display =
"flex";

const nums =
[3,2,1,"GO"];

for(let n of nums){

overlay.innerText = n;

await new Promise(r=>
setTimeout(r,1000)
);

}

overlay.style.display =
"none";

}

/* GENERATE */

function generateRace(){

const subject =
document.getElementById(
"subject"
).value;

const grade =
document.getElementById(
"grade"
).value;

const difficulty =
document.getElementById(
"difficulty"
).value;

const pool =

questionBank
[subject]
[grade]
[difficulty];

raceQuestions =
shuffle([...pool]).slice(0,10);

}

/* RENDER */

function renderQuestion(){

clearInterval(
timerInterval
);

timer = 20;

document
.getElementById("timer")
.innerText = timer;

const q =
raceQuestions[
currentQuestionIndex
];

if(!q){

finishRace();
return;

}

document
.getElementById("question")
.innerText = q.q;

const options =
document.getElementById(
"options"
);

const mathInput =
document.getElementById(
"mathInput"
);

options.innerHTML = "";

/* MATH */

if(

document
.getElementById("subject")
.value === "Math"

){

mathInput.style.display =
"block";

mathInput.value = "";

mathInput.focus();

mathInput.onkeydown =
function(e){

if(e.key === "Enter"){

checkMath();

}

};

}

/* OTHER SUBJECTS */

else{

mathInput.style.display =
"none";

q.o.forEach(
(option,index)=>{

const btn =
document.createElement(
"button"
);

btn.className =
"option-btn";

btn.innerText =
option;

btn.onclick =
()=>checkMCQ(index);

options.appendChild(btn);

}

);

}

/* TIMER */

timerInterval =
setInterval(()=>{

timer--;

document
.getElementById("timer")
.innerText = timer;

enemyMove();

if(timer <= 0){

clearInterval(
timerInterval
);

nextQuestion();

}

},1000);

}

/* MATH */

function checkMath(){

const input =

document
.getElementById(
"mathInput"
)
.value
.trim();

const q =
raceQuestions[
currentQuestionIndex
];

if(input === q.correct){

correctAnswer();

}

else{

nextQuestion();

}

}

/* MCQ */

function checkMCQ(index){

const q =
raceQuestions[
currentQuestionIndex
];

if(index === q.a){

correctAnswer();

}

else{

nextQuestion();

}

}

/* CORRECT */

function correctAnswer(){

players[0].score += 10;

boost();

moveCars();

nextQuestion();

}

/* BOOST */

function boost(){

const car =
document.getElementById(
"car0"
);

car.classList.add(
"boost"
);

setTimeout(()=>{

car.classList.remove(
"boost"
);

},600);

}

/* ENEMIES */

function enemyMove(){

players
.slice(1)
.forEach(player=>{

if(Math.random() > 0.55){

player.score += 10;

}

});

moveCars();

}

/* MOVE */

function moveCars(){

players.forEach((player,index)=>{

const car =
document.getElementById(
`car${index}`
);

if(car){

car.style.left =

Math.min(
player.score*2,
90
)

+ "%";

}

});

/* SCORE */

document
.getElementById("myScore")
.innerText =

players[0].score;

/* LEADER */

const maxEnemy =

Math.max(

...players
.slice(1)
.map(p=>p.score)

);

document
.getElementById("enemyScore")
.innerText =
maxEnemy;

}

/* NEXT */

function nextQuestion(){

clearInterval(
timerInterval
);

currentQuestionIndex++;

document
.getElementById(
"questionCount"
).innerText =

`${Math.min(currentQuestionIndex+1,10)}/10`;

renderQuestion();

}

/* HUD */

function updateHUD(){

document
.getElementById("myScore")
.innerText = 0;

document
.getElementById("enemyScore")
.innerText = 0;

}

/* FINISH */

function finishRace(){

document
.getElementById(
"winner"
).style.display =

"flex";

const sorted =
[...players]

.sort((a,b)=>
b.score-a.score
);

const winner =
sorted[0];

const title =
document.getElementById(
"winnerText"
);

const desc =
document.getElementById(
"winnerDesc"
);

if(winner.name === "YOU"){

title.innerText =
"🥇 You Won!";

}

else{

title.innerText =
`💀 ${winner.name} Won`;

}

desc.innerHTML =

sorted.map((p,index)=>`

<div style="
margin-top:10px;
font-size:18px;
">

${index+1}.
${p.name}
—
${p.score} pts

</div>

`).join("");

}

</script>
